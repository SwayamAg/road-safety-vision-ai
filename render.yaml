services:
  - type: web
    name: road-safety-vision-ai
    runtime: python
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_DIR
        value: models
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_SEGMENT_CAP_M
        value: "500.0"
      - key: DEFAULT_SAMPLE_FPS
        value: "5.0"
